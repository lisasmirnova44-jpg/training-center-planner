<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#20283b;--muted:#748096;--line:#e6eaf1;--primary:#5b61d6;--primary2:#eeefff;--green:#1d9465;--greenbg:#e8f7ef;--amber:#a9680c;--amberbg:#fff3dc;--red:#c34455;--redbg:#fff0f1;--shadow:0 8px 28px rgba(36,47,79,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;transition:.15s}button:focus,input:focus,select:focus,textarea:focus{outline:3px solid #b9bcff;outline-offset:1px}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{filter:brightness(.96)}.btn-light{background:#f0f2f8;color:#39445b}.btn-quiet{background:transparent;color:var(--muted);padding:7px}.btn-danger{background:var(--redbg);color:var(--red)}.shell{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.brand{display:flex;gap:13px;align-items:center}.logo{height:46px;width:46px;border-radius:15px;background:linear-gradient(135deg,#7479ee,#4b50c3);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px #777be544}.eyebrow{color:var(--primary);font-weight:750;text-transform:uppercase;letter-spacing:.09em;font-size:10px}.top h1{font-size:24px;line-height:1.15;margin:3px 0}.sub{color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:6px;padding:5px;background:#e9edf5;border-radius:13px;width:max-content;max-width:100%;margin-bottom:20px;overflow:auto}.tab{background:transparent;color:#657087;white-space:nowrap}.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px #1f2b4b12}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:17px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:600}.stat-icon{height:34px;width:34px;border-radius:11px;background:var(--primary2);display:grid;place-items:center;color:var(--primary);font-size:17px}.stat-num{font-size:29px;font-weight:800;letter-spacing:-.04em;margin:10px 0 2px}.stat-foot{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:16px}.panel{padding:20px;margin-bottom:16px;min-width:0}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 4px}.panel p{margin:0}.section-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 0 10px}.task-list{display:grid;gap:9px}.task{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px}.task-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);margin-top:6px;flex-shrink:0}.task-dot.red{background:var(--red)}.task-dot.green{background:var(--green)}.task-main{flex:1;min-width:0}.task-title{font-weight:750}.task-meta{color:var(--muted);font-size:12px;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#eef1f6;color:#667085;white-space:nowrap}.pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.red{background:var(--redbg);color:var(--red)}.pill.purple{background:var(--primary2);color:var(--primary)}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{padding:13px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px}.quick b{display:block;margin-bottom:3px}.quick span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{max-width:100%;width:auto;min-width:150px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#59647a}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dfe4ed;border-radius:10px;background:#fff;padding:10px 11px;color:var(--text);width:100%;min-width:0}.field textarea{resize:vertical;min-height:78px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .wide{grid-column:1/-1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8f9fc;padding:12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}.person{font-weight:750}.person-link:hover{color:var(--primary)!important;text-decoration:underline}.person-sub{font-size:12px;color:var(--muted);margin-top:3px}.row-actions{display:flex;gap:4px}.icon-btn{background:#f1f3f8;padding:7px 9px;color:#59647a}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.city-chip{font-size:11px;font-weight:800;padding:4px 7px;border-radius:7px;background:#eef2ff;color:#515bc5}.city-chip.spb{background:#e8f7f2;color:#168264}.timeline{display:grid;gap:9px}.timeline-item{display:grid;grid-template-columns:75px 1fr;gap:12px}.timeline-time{font-size:12px;color:var(--muted);font-weight:750;padding-top:13px}.timeline-card{border:1px solid var(--line);border-radius:12px;padding:12px}.timeline-card b{display:block}.day-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow:auto;padding-bottom:6px}.day-card{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;min-height:160px}.day-card.done{border-color:#b5e5cc;background:#f6fcf8}.day-card.current{border-color:#aaaef9;box-shadow:0 0 0 2px #eeeeff}.day-num{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.day-date{font-size:14px;font-weight:800;margin:4px 0 12px}.day-card select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.day-card .mini-label{font-size:11px;color:var(--muted);display:block;margin:8px 0 4px}.modal-backdrop{position:fixed;inset:0;background:#17213a80;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 80px #0e173344}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modal-head h2{margin:0;font-size:19px}.modal-body{padding:20px 22px}.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:#fff}.notice{border-radius:12px;padding:12px 14px;background:#f1f2ff;color:#4b51ad;font-size:12px;margin-bottom:14px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.footer{color:var(--muted);font-size:11px;text-align:center;padding:10px}.training-progress{height:6px;background:#edf0f6;border-radius:10px;overflow:hidden;margin-top:8px}.training-progress span{display:block;height:100%;background:var(--green)}.mini-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.mini-cal-head,.mini-cal-day{display:grid;place-items:center;min-height:34px;font-size:12px}.mini-cal-head{color:var(--muted);font-weight:800}.mini-cal-day{border-radius:9px;border:1px solid transparent;background:var(--greenbg);color:var(--green);font-weight:750;padding:5px 2px}.mini-cal-day.blocked{background:var(--redbg);color:var(--red);border-color:#f5cbd0}.mini-cal-day.past{background:#f1f3f7;color:#a0a7b5}.mini-cal-day.today{box-shadow:inset 0 0 0 2px var(--primary)}.mini-cal-day.empty{background:transparent;border:0}.mini-cal-free{display:block;font-size:8px;line-height:1.1;font-weight:650;white-space:nowrap}.mini-cal-day{min-width:0;display:flex;flex-direction:column;gap:2px}.calendar-slots-list{display:grid;gap:7px}.calendar-slot-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;align-items:start;padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-size:11px}.calendar-slot-row b{white-space:nowrap}.calendar-slot-row span{color:var(--green);line-height:1.5}.calendar-slots-empty{font-size:12px;color:var(--muted);padding:8px 0}.calendar-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.mini-calendar-nav{display:flex;align-items:center;gap:8px}.mini-calendar-nav button{padding:6px 10px}
@media(max-width:900px){.shell{padding:15px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}.day-grid{grid-template-columns:repeat(7,140px)}}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.panel{padding:15px}.stat{padding:13px}.stat-num{font-size:25px}.tabs{width:100%}.tab{padding:9px 11px}.quick-grid{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.shell{max-width:none;padding:0}.top-actions,.tabs,.toolbar,.row-actions,.no-print,.footer{display:none!important}.panel,.stat{box-shadow:none;break-inside:avoid}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.table-wrap{overflow:visible}table{min-width:0}th,td{padding:7px;font-size:10px}}

<body>
<div class="shell">
<header class="top"><div class="brand"><div class="logo">✦</div><div><div class="eyebrow">Панель руководителя</div><h1>Планер учебного центра</h1><div class="sub">Собеседования · кандидаты · 7 дней обучения</div></div></div><div class="top-actions"><button class="btn-light" id="exportBtn">↧ Выгрузить резервную копию</button><button class="btn-light" id="importBtn">↥ Загрузить копию</button><button class="btn-primary" id="addBtn">＋ Добавить кандидата</button><input type="file" id="importFile" accept="application/json" class="hidden"></div></header>
<nav class="tabs" aria-label="Разделы"><button class="tab active" data-view="dashboard">Обзор дня</button><button class="tab" data-view="candidates">Кандидаты</button><button class="tab" data-view="interviews">Собеседования</button><button class="tab" data-view="training">Обучение · 7 дней</button><button class="tab" data-view="followups">Жду ответа</button><button class="tab" data-view="availability">Доступность</button></nav>
<main id="app"></main><div class="footer">Подключение к общей базе данных…</div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Новый кандидат</h2><button class="btn-quiet" id="closeModal" aria-label="Закрыть">✕</button></div><form id="candidateForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn-danger hidden" id="deleteBtn">Удалить кандидата</button><div style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn-light" id="cancelBtn">Отмена</button><button type="submit" class="btn-primary">Сохранить</button></div></div></form></section></div>
<script>
(()=>{'use strict';
const KEY='trainingCenterPlanner_v1';
const SUPABASE_URL='https://ukzrxtuxurfzlujyymfa.supabase.co';
const SUPABASE_KEY='sb_publishable_MTfzfCn3RI8VvF1vU5z3mQ_5GZNwEFY';
const CLOUD_ID='shared_planner_state';
let cloudReady=false, cloudUpdatedAt=null, cloudWriteTimer=null, cloudWriting=false, cloudDirty=false, lastLocalChange=0;
function cloudStatus(message){const el=document.querySelector('.footer');if(el)el.textContent=message;}
function cloudHeaders(extra={}){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,...extra};}
function cloudEndpoint(){return SUPABASE_URL+'/rest/v1/candidates';}
async function readCloud(){const r=await fetch(cloudEndpoint()+'?id=eq.'+encodeURIComponent(CLOUD_ID)+'&select=data,updated_at',{headers:cloudHeaders()});if(!r.ok)throw new Error('Не удалось прочитать данные Supabase ('+r.status+')');return await r.json();}
async function writeCloud(){if(!cloudReady)return;if(cloudWriting){cloudDirty=true;return;}cloudWriting=true;cloudDirty=false;try{const stamp=new Date().toISOString();const payload={id:CLOUD_ID,data:state,updated_at:stamp};const r=await fetch(cloudEndpoint()+'?on_conflict=id',{method:'POST',headers:cloudHeaders({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(payload)});if(!r.ok){const detail=await r.text();throw new Error('Не удалось сохранить данные в Supabase ('+r.status+'): '+detail);}const rows=await readCloud();if(rows[0])cloudUpdatedAt=rows[0].updated_at;cloudStatus('☁ Общий планер подключён · синхронизация работает');}catch(err){console.error(err);cloudStatus('⚠ Нет связи с общей базой. Данные пока сохранены в этом браузере.');}finally{cloudWriting=false;if(cloudDirty)writeCloud();}}
function scheduleCloudSave(){lastLocalChange=Date.now();if(cloudWriteTimer)clearTimeout(cloudWriteTimer);cloudWriteTimer=setTimeout(()=>writeCloud(),500);}
async function initCloud(){cloudStatus('☁ Подключаем общую базу…');try{const rows=await readCloud();if(rows.length){const remote=rows[0];if(remote.data&&typeof remote.data==='object'){state={candidates:Array.isArray(remote.data.candidates)?remote.data.candidates:[],interviews:Array.isArray(remote.data.interviews)?remote.data.interviews:[],blockedDates:Array.isArray(remote.data.blockedDates)?remote.data.blockedDates:[]};localStorage.setItem(KEY,JSON.stringify(state));render();}cloudUpdatedAt=remote.updated_at||null;cloudReady=true;cloudStatus('☁ Общий планер подключён · синхронизация работает');}else{cloudReady=true;await writeCloud();}}catch(err){console.error(err);cloudReady=false;cloudStatus('⚠ Не удалось подключить общую базу. Проверь настройки Supabase.');}}
async function pollCloud(){if(!cloudReady||cloudWriting||Date.now()-lastLocalChange<1800)return;try{const rows=await readCloud();if(!rows.length)return;const remote=rows[0];if(remote.updated_at&&remote.updated_at!==cloudUpdatedAt){state={candidates:Array.isArray(remote.data?.candidates)?remote.data.candidates:[],interviews:Array.isArray(remote.data?.interviews)?remote.data.interviews:[],blockedDates:Array.isArray(remote.data?.blockedDates)?remote.data.blockedDates:[]};localStorage.setItem(KEY,JSON.stringify(state));cloudUpdatedAt=remote.updated_at;render();cloudStatus('☁ Данные обновлены с общей базы');}}catch(err){console.error(err);cloudStatus('⚠ Временно нет связи с общей базой');}}
setInterval(pollCloud,5000);
const salons={ 'МСК':['Румер','Румянцево','Кутузовский','Европолис'],'СПБ':['Юго-Запад','Дальневосточный','Кубатура','Мебельбург','Васька','Коменда','Девяткино']};
const statuses=['Новый кандидат','Собеседование назначено','Жду ответа','Подходит','Ожидает выхода','Обучается','Обучение завершено','Отказ','Не вышел на связь','Не вышел на обучение'];
const interviewStatuses=['Запланировано','Состоялось','Перенесено','Не пришёл','Отменено'];
const taskStatuses=['Не начато','В процессе','Выполнено','Пропуск'];
let state=load(),view='dashboard',editingId=null;let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {candidates:Array.isArray(x.candidates)?x.candidates:[],interviews:Array.isArray(x.interviews)?x.interviews:[],blockedDates:Array.isArray(x.blockedDates)?x.blockedDates:[]}}catch(e){return {candidates:[],interviews:[],blockedDates:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render();scheduleCloudSave()}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateStr(d){if(!d)return '';let x=new Date(d+'T12:00:00');return isNaN(x)?'':x.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(s,n){if(!s)return '';const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dt(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d}
function fmtDateTime(s){const d=dt(s);return d?d.toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'Дата не указана'}
function cityClass(c){return c==='СПБ'?'spb':''}
function pillStatus(s){let cl=['Подходит','Обучение завершено','Выполнено'].includes(s)?'green':['Жду ответа','Ожидает выхода','Собеседование назначено','Обучается'].includes(s)?'amber':['Отказ','Не пришёл','Не вышел на связь','Не вышел на обучение'].includes(s)?'red':'purple';return `<span class="pill ${cl}">${esc(s||'Не указан')}</span>`}
function cityOptions(selected){return ['МСК','СПБ'].map(c=>`<option ${selected===c?'selected':''}>${c}</option>`).join('')}
function salonOptions(city,selected){return (salons[city]||[]).map(s=>`<option ${selected===s?'selected':''}>${esc(s)}</option>`).join('')}
function statusOptions(selected){return statuses.map(s=>`<option ${selected===s?'selected':''}>${esc(s)}</option>`).join('')}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,value=''){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options}</select></div>`}
function getCandidate(id){return state.candidates.find(c=>c.id===id)}
function nextAction(c){return c.nextDate?`${dateStr(c.nextDate)}${c.nextTime?' · '+c.nextTime:''}`:'Дата не назначена'}
function followupDue(c){return c.nextDate&&c.nextDate<=today()&&c.status!=='Отказ'&&c.status!=='Обучение завершено'}
function trainingDayStatus(c){return (c.days||[]).filter(d=>d.status==='Пройден').length}
function sortedCandidates(arr){return [...arr].sort((a,b)=>(a.nextDate||'9999').localeCompare(b.nextDate||'9999')||(a.name||'').localeCompare(b.name||''))}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const root=document.getElementById('app');if(view==='dashboard')root.innerHTML=dashboard();if(view==='candidates')root.innerHTML=candidatesView();if(view==='interviews')root.innerHTML=interviewsView();if(view==='training')root.innerHTML=trainingView();if(view==='followups')root.innerHTML=followupsView();if(view==='availability')root.innerHTML=availabilityView();bindDynamic()}
function availabilityView(){const blocked=[...(state.blockedDates||[])].sort();return `<section class="panel"><div class="panel-head"><div><h2>Доступность для собеседований</h2><p class="sub small">Собеседования можно назначать только с 15:30 до 18:00. Закрытые даты будут заблокированы.</p></div></div><div class="notice">Доступное время для собеседований: с 15:30 до 18:00 с шагом 30 минут.</div><form id="blockDateForm" class="form-grid"><div class="field"><label for="blockedDate">Дата, когда собеседования недоступны</label><input id="blockedDate" name="date" type="date" required></div><div class="field"><label for="blockedReason">Причина / заметка (необязательно)</label><input id="blockedReason" name="reason" placeholder="Например, обучение во вторник"></div><div class="wide"><button class="btn-primary" type="submit">＋ Заблокировать дату</button></div></form><div class="section-label">Закрытые даты</div>${blocked.length?`<div class="task-list">${blocked.map(date=>{const b=typeof date==='string'?{date,reason:''}:date;return `<div class="task"><span class="task-dot red"></span><div class="task-main"><div class="task-title">${dateStr(b.date)}</div><div class="task-meta">${esc(b.reason||'Собеседования недоступны весь день')}</div></div><button class="btn-danger" data-unblock-date="${esc(b.date)}">Разрешить</button></div>`}).join('')}</div>`:`<div class="empty"><strong>Пока нет закрытых дат</strong>Добавь день обучения или другой занятый день — новые собеседования на него будут запрещены.</div>`}</section>`}
function miniCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),daysInMonth=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7,monthLabel=calendarMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),slots=['15:00','15:30','16:00','16:30','17:00','17:30','18:00'];const isBlocked=date=>(state.blockedDates||[]).some(x=>(typeof x==='string'?x:x.date)===date);const freeSlots=date=>isBlocked(date)?[]:slots.filter(slot=>!state.interviews.some(i=>i.date===date+'T'+slot&&i.status!=='Отменено'));let cells='';for(let i=0;i<offset;i++)cells+='<div class="mini-cal-day empty"></div>';for(let d=1;d<=daysInMonth;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,blocked=isBlocked(date),past=date<today(),isToday=date===today(),count=state.interviews.filter(i=>i.date&&i.date.slice(0,10)===date&&i.status!=='Отменено').length,free=freeSlots(date),cls=['mini-cal-day',blocked?'blocked':'',isToday?'today':'',past?'past':''].filter(Boolean).join(' '),reason=(state.blockedDates||[]).find(x=>(typeof x==='string'?x:x.date)===date),title=blocked?(typeof reason==='string'?'Собеседования закрыты':(reason?.reason||'Собеседования закрыты')):`Собеседований: ${count}. Свободно (${free.length}): ${free.length?free.join(', '):'нет свободных слотов'}`;cells+=`<div class="${cls}" title="${esc(title)}"><span>${d}${count&&!blocked?`<sup style="font-size:9px;margin-left:2px">${count}</sup>`:''}</span><small class="mini-cal-free">${blocked?'закрыто':free.length?`своб. ${free.length}`:'нет мест'}</small></div>`;}const upcoming=[];for(let n=0;n<7;n++){const date=addDays(today(),n),free=freeSlots(date);if(free.length)upcoming.push({date,free});}const slotsSummary=upcoming.length?`<div class="section-label">Свободные окошки · ближайшие 7 дней</div><div class="calendar-slots-list">${upcoming.map(x=>`<div class="calendar-slot-row"><b>${dateStr(x.date)}</b><span>${x.free.join(' · ')}</span></div>`).join('')}</div>`:`<div class="calendar-slots-empty">На ближайшие 7 дней свободных окошек нет.</div>`;return `<section class="panel"><div class="panel-head"><div><h2>Календарь доступности</h2><p class="sub small">Количество встреч и свободные слоты</p></div><div class="mini-calendar-nav"><button class="btn-light" data-cal-prev aria-label="Предыдущий месяц">‹</button><button class="btn-light" data-cal-next aria-label="Следующий месяц">›</button></div></div><div style="text-align:center;font-weight:800;text-transform:capitalize;margin:-4px 0 10px">${monthLabel}</div><div class="mini-calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="mini-cal-head">${x}</div>`).join('')}${cells}</div><div class="calendar-legend"><span><i class="legend-dot" style="background:var(--green)"></i>Есть свободные слоты</span><span><i class="legend-dot" style="background:var(--red)"></i>Закрыто</span><span>Наведись на дату, чтобы увидеть точное время</span></div>${slotsSummary}<div style="margin-top:12px"><button class="btn-light" data-goto="availability">Управлять доступностью →</button></div></section>`}
function dashboard(){const active=state.candidates.filter(c=>!['Отказ','Обучение завершено'].includes(c.status));const due=sortedCandidates(active.filter(followupDue));const starting=sortedCandidates(active.filter(c=>c.startDate&&c.startDate>=today()&&c.startDate<=addDays(today(),7)&&!['Обучение завершено','Отказ'].includes(c.status)));const interviewing=state.interviews.filter(i=>i.date&&i.date.slice(0,10)===today()&&i.status==='Запланировано').sort((a,b)=>a.date.localeCompare(b.date));const studying=active.filter(c=>c.status==='Обучается');const upcoming=state.interviews.filter(i=>i.date&&i.date>=new Date().toISOString().slice(0,16)&&i.status==='Запланировано').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);

function candidatesView(){return `<section class="panel"><div class="panel-head"><div><h2>База кандидатов</h2><p class="sub small">Одна карточка на человека — все договорённости в одном месте</p></div><button class="btn-primary" data-add>＋ Добавить кандидата</button></div><div class="toolbar"><input id="candidateSearch" placeholder="Поиск по имени, телефону, салону…"><select id="cityFilter"><option value="">Все города</option>${cityOptions('')}</select><select id="statusFilter"><option value="">Все статусы</option>${statuses.map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="salonFilter"><option value="">Все салоны</option>${Object.entries(salons).flatMap(([c,ss])=>ss.map(s=>`<option value="${esc(s)}">${c} — ${esc(s)}</option>`)).join('')}</select></div><div id="candidateTable"></div></section>`}

function trainingList(input){const q=(document.getElementById('trainingSearch')?.value||'').toLowerCase(),city=document.getElementById('trainingCity')?.value||'',range=document.getElementById('trainingRange')?.value||'active';const arr=input.filter(c=>(!q||[c.name,c.salon,c.phone].join(' ').toLowerCase().includes(q))&&(!city||c.city===city)&&(range==='all'||(range==='upcoming'&&c.startDate>=today()&&c.startDate<=addDays(today(),7))||(range==='past'&&c.startDate<today())||(range==='active'&&c.status!=='Обучение завершено'&&c.startDate>=addDays(today(),-7))));return arr.length?arr.map(c=>{const days=ensureDays(c);return `<section class="panel" style="box-shadow:none;margin-bottom:13px"><div class="panel-head"><div><h2>${esc(c.name)} <span class="city-chip ${cityClass(c.city)}">${esc(c.city)}</span></h2><p class="sub small">${esc(c.salon||'Салон не указан')} · Старт: ${dateStr(c.startDate)} · ${trainingDayStatus(c)}/7 дней пройдено</p></div><div style="display:flex;gap:7px;flex-wrap:wrap">${pillStatus(c.status)}<button class="btn-light" data-edit="${c.id}">Карточка</button></div></div><div class="day-grid">${days.map((d,idx)=>`<div class="day-card ${d.status==='Пройден'?'done':''} ${d.date===today()?'current':''}"><div class="day-num">День ${idx+1}</div><div class="day-date">${dateStr(d.date)||'Укажи дату'}</div><label class="mini-label" for="daydate_${c.id}_${idx}">Дата</label><input type="date" id="daydate_${c.id}_${idx}" data-day-date="${c.id}:${idx}" value="${esc(d.date||'')}" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px"><span class="mini-label">Статус дня</span><select data-day-status="${c.id}:${idx}">${['Запланирован','Пройден','Пропуск','Перенос'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="mini-label" for="daynote_${c.id}_${idx}">Заметка</label><input id="daynote_${c.id}_${idx}" data-day-note="${c.id}:${idx}" value="${esc(d.note||'')}" placeholder="Например, тема дня" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px"></div>`).join('')}</div></section>`}).join(''):`<div class="empty"><strong>Нет кандидатов с датой начала обучения</strong>Открой карточку кандидата и укажи дату выхода — план на 7 дней сформируется автоматически.</div>`}
